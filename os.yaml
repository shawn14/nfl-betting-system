project: prediction-matrix
repository: https://github.com/shawn14/nfl-betting-system
production_url: https://www.predictionmatrix.com
research_surface:
  path: /terminal
  state: verified_production_collection_disabled
data_sources:
  - Existing public prediction and odds-board Vercel Blob snapshots
  - ESPN scheduled and final game records
  - Firestore immutable pregame measurement, disabled by default
  - Existing paid Odds API collectors; never invoke as a test
mcp_packs: []
deployment:
  method: GitHub branch to Vercel preview, approved main merge to automatic production deployment
  runbook: docs/measurement/README.md
  read_only_gate: node scripts/measurement/release-check.mjs
  activation_operator: node scripts/measurement/activate.mjs
  storage_inspection: node scripts/measurement/inspect-production.mjs
  source_diagnostic: node scripts/measurement/diagnose.mjs
  preview_runbook: docs/preview/README.md
capabilities:
  - ~/projects/CAPABILITIES.md#sports-betting-sharp-fair-value-line-shopping-clv-ledger-market-lab--home-nfl-betting-system
proof:
  - docs/terminal/README.md
  - docs/measurement/README.md
  - docs/odds-identity/README.md
  - docs/measurement/provenance/README.md
  - docs/measurement/activation/README.md
  - docs/measurement/SOURCE-DIAGNOSIS.md
  - docs/measurement/RESEARCH-LOOP.md
